syntax = "proto3";

package broker;

// Kafka Broker Service
service Broker {
  // Topic Management
  rpc GetTopicMetadata(TopicMetadataRequest) returns (TopicMetadataResponse);

  // Producer Operations
  rpc Produce(ProduceRequest) returns (ProduceResponse);

  // Consumer Operations
  rpc Fetch(FetchRequest) returns (FetchResponse);
  rpc ListOffsets(ListOffsetsRequest) returns (ListOffsetsResponse);

  // Consumer Group Coordination
  rpc FindCoordinator(GroupCoordinatorRequest) returns (GroupCoordinatorResponse);
  rpc JoinGroup(JoinGroupRequest) returns (JoinGroupResponse);
  rpc SyncGroup(SyncGroupRequest) returns (SyncGroupResponse);
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
  rpc LeaveGroup(LeaveGroupRequest) returns (LeaveGroupResponse);

  // Offset Management
  rpc CommitOffset(OffsetCommitRequest) returns (OffsetCommitResponse);
  rpc FetchOffset(OffsetFetchRequest) returns (OffsetFetchResponse);
}

// ==================== RECORDS ====================

/// A single message in a produce request.
message Record {
  optional bytes key = 1;
  bytes value = 2;
}

/// A single message returned in a fetch response.
message FetchedRecord {
  int64 offset = 1;
  optional bytes key = 2;
  bytes value = 3;
}

// ==================== TOPIC METADATA ====================

message TopicMetadataRequest {
  repeated string topics = 1;
}

message TopicMetadataResponse {
  repeated Broker brokers = 1;
  repeated TopicMetadata topics = 2;

  message Broker {
    int32 node_id = 1;
    string host = 2;
    int32 port = 3;
  }

  message TopicMetadata {
    int32 topic_error_code = 1;
    string topic_name = 2;
    repeated PartitionMetadata partitions = 3;
  }

  message PartitionMetadata {
    int32 partition_error_code = 1;
    int32 partition_id = 2;
    int32 leader = 3;
    repeated int32 replicas = 4;
    repeated int32 isr = 5;  // In-Sync Replicas
  }
}

// ==================== PRODUCE ====================

message ProduceRequest {
  int32 required_acks = 1;  // -1=all, 0=none, 1=leader
  int32 timeout_ms = 2;
  repeated TopicData topics = 3;

  message TopicData {
    string topic_name = 1;
    repeated PartitionData partitions = 2;
  }

  message PartitionData {
    int32 partition = 1;
    repeated Record records = 2;
  }
}

message ProduceResponse {
  repeated TopicResult results = 1;

  message TopicResult {
    string topic_name = 1;
    repeated PartitionResult partitions = 2;
  }

  message PartitionResult {
    int32 partition = 1;
    int32 error_code = 2;
    int64 offset = 3;
  }
}

// ==================== FETCH ====================

message FetchRequest {
  int32 replica_id = 1;  // -1 for consumer
  int32 max_wait_time = 2;  // Max time to wait (ms)
  int32 min_bytes = 3;  // Min bytes to respond
  repeated TopicData topics = 4;

  message TopicData {
    string topic_name = 1;
    repeated PartitionData partitions = 2;
  }

  message PartitionData {
    int32 partition = 1;
    int64 fetch_offset = 2;
    int32 max_bytes = 3;
  }
}

message FetchResponse {
  repeated TopicResult topics = 1;

  message TopicResult {
    string topic_name = 1;
    repeated PartitionResult partitions = 2;
  }

  message PartitionResult {
    int32 partition = 1;
    int32 error_code = 2;
    int64 high_watermark_offset = 3;
    repeated FetchedRecord records = 4;
  }
}

// ==================== LIST OFFSETS ====================

message ListOffsetsRequest {
  int32 replica_id = 1;
  repeated TopicData topics = 2;

  message TopicData {
    string topic_name = 1;
    repeated PartitionData partitions = 2;
  }

  message PartitionData {
    int32 partition = 1;
    int64 time = 2;  // -1=latest, -2=earliest
    int32 max_number_of_offsets = 3;
  }
}

message ListOffsetsResponse {
  repeated TopicResult topics = 1;

  message TopicResult {
    string topic_name = 1;
    repeated PartitionOffsets partitions = 2;
  }

  message PartitionOffsets {
    int32 partition = 1;
    int32 error_code = 2;
    repeated int64 offsets = 3;
  }
}

// ==================== GROUP COORDINATOR ====================

message GroupCoordinatorRequest {
  string group_id = 1;
}

message GroupCoordinatorResponse {
  int32 error_code = 1;
  int32 coordinator_id = 2;
  string coordinator_host = 3;
  int32 coordinator_port = 4;
}

// ==================== JOIN GROUP ====================

message JoinGroupRequest {
  string group_id = 1;
  int32 session_timeout = 2;
  string member_id = 3;
  string protocol_type = 4;
  repeated GroupProtocol group_protocols = 5;

  message GroupProtocol {
    string protocol_name = 1;
    bytes protocol_metadata = 2;
  }
}

message JoinGroupResponse {
  int32 error_code = 1;
  int32 generation_id = 2;
  string group_protocol = 3;
  string leader_id = 4;
  string member_id = 5;
  repeated Member members = 6;

  message Member {
    string member_id = 1;
    bytes member_metadata = 2;
  }
}

// ==================== SYNC GROUP ====================

message SyncGroupRequest {
  string group_id = 1;
  int32 generation_id = 2;
  string member_id = 3;
  repeated Assignment group_assignment = 4;

  message Assignment {
    string member_id = 1;
    bytes member_assignment = 2;
  }
}

message SyncGroupResponse {
  int32 error_code = 1;
  bytes member_assignment = 2;
}

// ==================== HEARTBEAT ====================

message HeartbeatRequest {
  string group_id = 1;
  int32 generation_id = 2;
  string member_id = 3;
}

message HeartbeatResponse {
  int32 error_code = 1;
}

// ==================== LEAVE GROUP ====================

message LeaveGroupRequest {
  string group_id = 1;
  string member_id = 2;
}

message LeaveGroupResponse {
  int32 error_code = 1;
}

// ==================== OFFSET COMMIT ====================

message OffsetCommitRequest {
  string consumer_group_id = 1;
  repeated TopicData topics = 2;

  message TopicData {
    string topic_name = 1;
    repeated PartitionData partitions = 2;
  }

  message PartitionData {
    int32 partition = 1;
    int64 offset = 2;
    string metadata = 3;
  }
}

message OffsetCommitResponse {
  repeated TopicResult topics = 1;

  message TopicResult {
    string topic_name = 1;
    repeated PartitionResult partitions = 2;
  }

  message PartitionResult {
    int32 partition = 1;
    int32 error_code = 2;
  }
}

// ==================== OFFSET FETCH ====================

message OffsetFetchRequest {
  string consumer_group_id = 1;
  repeated TopicData topics = 2;

  message TopicData {
    string topic_name = 1;
    repeated int32 partitions = 2;
  }
}

message OffsetFetchResponse {
  repeated TopicResult topics = 1;

  message TopicResult {
    string topic_name = 1;
    repeated PartitionResult partitions = 2;
  }

  message PartitionResult {
    int32 partition = 1;
    int64 offset = 2;
    string metadata = 3;
    int32 error_code = 4;
  }
}

// ==================== ERROR CODES ====================

enum ErrorCode {
  NO_ERROR = 0;
  UNKNOWN = 1;
  OFFSET_OUT_OF_RANGE = 2;
  INVALID_MESSAGE = 3;
  UNKNOWN_TOPIC_OR_PARTITION = 4;
  LEADER_NOT_AVAILABLE = 5;
  NOT_LEADER_FOR_PARTITION = 6;
  OFFSET_METADATA_TOO_LARGE = 7;
  GROUP_LOAD_IN_PROGRESS = 8;
  GROUP_COORDINATOR_NOT_AVAILABLE = 9;
  NOT_COORDINATOR_FOR_GROUP = 10;
  INVALID_GROUP_ID = 11;
  UNKNOWN_MEMBER_ID = 12;
  INVALID_SESSION_TIMEOUT = 13;
  REBALANCE_IN_PROGRESS = 14;
}
